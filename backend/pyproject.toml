[project]
name = "echocare-backend"
version = "0.1.0"
description = "FastAPI backend for EchoCare"
requires-python = ">=3.11"
dependencies = [
    "bcrypt==4.1.3",
    "certifi>=2024.2.2",
    "email-validator>=2.3.0",
    "fastapi==0.111.0",
    "google-genai>=1.46.0",
    "groq>=1.7.0",
    "httpx>=0.28.1",
    "motor==3.4.0",
    "pydantic==2.7.1",
    "pymongo==4.7.2",
    "pymupdf==1.24.3",
    "python-dotenv==1.0.1",
    "python-jose[cryptography]==3.3.0",
    "python-multipart==0.0.9",
    "slowapi>=0.1.10",
    "uvicorn[standard]==0.29.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
